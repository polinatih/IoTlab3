; IoT — Лабораторные работы 3.1 и 3.2: аналоговый датчик температуры TMP36 + LCD 1602 + FreeRTOS
; Какая лаба собирается — выбирается в src/app_config.h (APP_NAME)
;
; Какая плата — выбирается строкой default_envs ниже:
;   mega — Arduino Mega 2560 (в лаборатории)
;   uno  — Arduino Uno (схема в Tinkercad, симулятор Wokwi)
; Можно также выбрать окружение внизу VS Code (кнопка «Default (IoT_Lab3)» -> env:uno / env:mega).

[platformio]
default_envs = mega

; Общие настройки для обеих плат
[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
    feilipu/FreeRTOS@^11.1.0-3
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    arduino-libraries/LiquidCrystal@^1.0.7

[env:mega]
board = megaatmega2560
; LCD: автоопределение — экран с платой I2C (SDA=20, SCL=21) или параллельный 1602A
; (RS=12, E=11, D4..D7 = 5,4,3,2). Тип экрана печатается в Serial при старте.

[env:uno]
board = uno
; Экономия ОЗУ (у ATmega328P всего 2 КБ): буферы Serial 32 байта вместо 64.
; Освобождённая память нужна FreeRTOS для служебных задач Idle и Timer.
; LCD на Uno — только I2C (SDA=A4, SCL=A5).
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=32
    -D SERIAL_TX_BUFFER_SIZE=32
